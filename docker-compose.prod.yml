# Production : site, worker, base de données, Redis, recherche, stockage des images et HTTPS automatique.
# Tout se règle dans le fichier .env (modèle : deploiement/env.production.exemple).
#   Démarrer : docker compose -f docker-compose.prod.yml up -d
#   Journaux : docker compose -f docker-compose.prod.yml logs -f site worker

name: hlm-prod

x-application: &application
  build:
    context: .
    args:
      APP_URL: https://${DOMAINE}
      NEXT_PUBLIC_NOM_SITE: ${NEXT_PUBLIC_NOM_SITE:-HLM}
      NEXT_PUBLIC_URL_IMAGES: ${NEXT_PUBLIC_URL_IMAGES:-https://images.${DOMAINE}/hlm}
      NEXT_PUBLIC_VAPID_CLE_PUBLIQUE: ${NEXT_PUBLIC_VAPID_CLE_PUBLIQUE:-}
  image: hlm:production
  restart: unless-stopped
  env_file: .env
  environment:
    APP_URL: https://${DOMAINE}
    DATABASE_URL: postgresql://hlm:${POSTGRES_MOT_DE_PASSE}@postgres:5432/hlm
    REDIS_URL: redis://redis:6379
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_CLE: ${MEILISEARCH_CLE}
    S3_ENDPOINT: ${S3_ENDPOINT:-http://stockage:9000}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-hlm}
    NEXT_PUBLIC_URL_IMAGES: ${NEXT_PUBLIC_URL_IMAGES:-https://images.${DOMAINE}/hlm}

services:
  # Applique les migrations de la base puis s'arrête ; le site attend qu'il ait fini.
  migration:
    <<: *application
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  site:
    <<: *application
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Traitement des planches, publications programmées, synchronisations, notifications.
  worker:
    <<: *application
    command: ["npm", "run", "worker"]
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hlm
      POSTGRES_PASSWORD: ${POSTGRES_MOT_DE_PASSE}
      POSTGRES_DB: hlm
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hlm -d hlm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - donnees_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_CLE}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - donnees_meilisearch:/meili_data

  # Stockage des images sur le serveur. Inutile si vous utilisez Cloudflare R2 (voir le guide).
  stockage:
    image: rustfs/rustfs:1.0.5
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - donnees_stockage:/data

  # Seul service ouvert sur Internet : reçoit le trafic, obtient et renouvelle les certificats HTTPS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAINE: ${DOMAINE}
      EMAIL_CERTIFICATS: ${EMAIL_CERTIFICATS:?Renseignez EMAIL_CERTIFICATS dans le fichier .env}
    volumes:
      - ./deploiement/Caddyfile:/etc/caddy/Caddyfile:ro
      - donnees_caddy:/data
      - config_caddy:/config
    depends_on:
      - site

volumes:
  donnees_postgres:
  donnees_redis:
  donnees_meilisearch:
  donnees_stockage:
  donnees_caddy:
  config_caddy:
