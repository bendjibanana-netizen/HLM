# Services de développement local.
# Démarrage : docker compose up -d      Arrêt : docker compose down
# Remise à zéro complète (supprime les données) : docker compose down -v

name: hlm

services:
  # Base de données principale
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hlm
      POSTGRES_PASSWORD: hlm
      POSTGRES_DB: hlm
    ports:
      - "5432:5432"
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hlm -d hlm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Files d'attente (BullMQ) et dédoublonnage des vues
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - donnees_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stockage des images, compatible S3 (remplacé par Cloudflare R2 en production).
  # RustFS remplace MinIO, dont les images Docker ne sont plus publiées.
  # Le bucket est créé par l'application au premier usage du stockage (phase 2).
  stockage:
    image: rustfs/rustfs:1.0.5
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: cle-acces-dev
      RUSTFS_SECRET_KEY: cle-secrete-dev
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console web
    volumes:
      - donnees_stockage:/data

  # Moteur de recherche instantanée
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: cle-maitre-dev-a-changer
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - donnees_meilisearch:/meili_data

  # Boîte mail de test : tous les emails envoyés en local arrivent ici
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interface web

volumes:
  donnees_postgres:
  donnees_redis:
  donnees_stockage:
  donnees_meilisearch:
